<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">代码质量方法论关系图</title>
  <desc id="desc">面向对象、设计原则、设计模式、编程规范和代码重构共同服务于编写高质量代码。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f6bff"/>
      <stop offset="100%" stop-color="#0a9f8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17406b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c93"/>
    </marker>
    <style>
      .label { font: 700 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #102033; }
      .sub { font: 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #51657d; }
      .small { font: 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #60748c; }
      .box { fill: #fff; stroke: #d7e5f5; stroke-width: 2; filter: url(#shadow); }
      .line { fill: none; stroke: #6b7c93; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="420" rx="28" fill="url(#bg)"/>
  <text x="490" y="48" text-anchor="middle" class="label">编写高质量代码的方法论</text>
  <text x="490" y="76" text-anchor="middle" class="sub">从基础范式到落地实践，共同支撑可读、可维护、可扩展的代码</text>

  <rect x="390" y="160" width="200" height="96" rx="20" fill="url(#core)" filter="url(#shadow)"/>
  <text x="490" y="202" text-anchor="middle" font-family='"Noto Sans SC", "Microsoft YaHei", sans-serif' font-size="26" font-weight="700" fill="#fff">高质量代码</text>
  <text x="490" y="230" text-anchor="middle" font-family='"Noto Sans SC", "Microsoft YaHei", sans-serif' font-size="15" fill="#eaf7ff">可读 / 可维护 / 可扩展</text>

  <rect x="70" y="130" width="190" height="82" rx="18" class="box"/>
  <text x="165" y="164" text-anchor="middle" class="label">面向对象</text>
  <text x="165" y="190" text-anchor="middle" class="small">封装、抽象、继承、多态</text>

  <rect x="90" y="276" width="190" height="82" rx="18" class="box"/>
  <text x="185" y="310" text-anchor="middle" class="label">设计原则</text>
  <text x="185" y="336" text-anchor="middle" class="small">指导取舍和边界设计</text>

  <rect x="395" y="300" width="190" height="82" rx="18" class="box"/>
  <text x="490" y="334" text-anchor="middle" class="label">设计模式</text>
  <text x="490" y="360" text-anchor="middle" class="small">常见设计问题的方案</text>

  <rect x="700" y="276" width="190" height="82" rx="18" class="box"/>
  <text x="795" y="310" text-anchor="middle" class="label">编程规范</text>
  <text x="795" y="336" text-anchor="middle" class="small">命名、结构、注释、风格</text>

  <rect x="720" y="130" width="190" height="82" rx="18" class="box"/>
  <text x="815" y="164" text-anchor="middle" class="label">代码重构</text>
  <text x="815" y="190" text-anchor="middle" class="small">持续改善已有设计</text>

  <path d="M260 171 C310 171 333 190 390 200" class="line"/>
  <path d="M280 317 C332 306 352 260 395 231" class="line"/>
  <path d="M490 300 L490 260" class="line"/>
  <path d="M700 317 C648 306 628 260 585 231" class="line"/>
  <path d="M720 171 C670 171 647 190 590 200" class="line"/>

  <path d="M188 212 C188 240 188 250 188 276" class="line"/>
  <path d="M280 317 C330 350 350 350 395 342" class="line"/>
  <path d="M585 342 C630 350 650 350 700 317" class="line"/>
  <path d="M795 276 C805 250 812 238 815 212" class="line"/>
</svg>
